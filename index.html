<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Command Checkers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-bar-container">
                <div class="loading-bar"></div>
            </div>
            <p class="loading-text">Loading game assets...</p>
        </div>
    </div>

    <!-- Intro Scene -->
    <div id="intro-scene" class="intro-scene" style="display: none;">
        <img id="intro-image" class="intro-image" src="" alt="Intro">
    </div>

    <!-- Start Game Overlay -->
    <div id="start-overlay" class="start-overlay" style="display: none;">
        <div class="start-background-image"></div>
        <div class="start-content">
            <button id="start-game-btn" class="start-game-btn">Start Game</button>
        </div>
    </div>

    <!-- Tutorial Prompt Overlay (AI mode only) -->
    <div id="tutorial-prompt" class="tutorial-prompt" style="display: none;">
        <div class="tutorial-prompt-content">
            <h2>Welcome to Voice Command Checkers!</h2>
            <p>Would you like to enable the tutorial to learn how to play?</p>
            <div class="tutorial-prompt-buttons">
                <button id="tutorial-yes-btn" class="tutorial-btn tutorial-yes">Yes, show tutorial</button>
                <button id="tutorial-no-btn" class="tutorial-btn tutorial-no">No, I know how to play</button>
            </div>
        </div>
    </div>

    <!-- Tutorial Overlay -->
    <div id="tutorial-overlay" class="tutorial-overlay" style="display: none;">
        <div class="tutorial-dimmer" id="tutorial-dimmer"></div>
        <div class="tutorial-box" id="tutorial-box">
            <button id="tutorial-skip-btn" class="tutorial-skip-btn" title="Skip Tutorial">✕</button>
            <h3 id="tutorial-title">Tutorial</h3>
            <p id="tutorial-text">Welcome to the tutorial!</p>
            <div id="tutorial-buttons" class="tutorial-buttons">
                <button id="tutorial-action-btn" class="tutorial-action-btn" style="display: none;">Got it!</button>
            </div>
        </div>
        <div class="tutorial-arrow" id="tutorial-arrow" style="display: none;">
            <svg width="40" height="40" viewBox="0 0 40 40">
                <path d="M20,35 L10,15 L15,15 L15,5 L25,5 L25,15 L30,15 Z" fill="#facc15" stroke="#1a1a1a" stroke-width="2"/>
            </svg>
        </div>
        <div class="tutorial-highlight" id="tutorial-highlight" style="display: none;"></div>
    </div>

    <!-- Game End Overlay -->
    <div id="game-end-overlay" class="game-end-overlay" style="display: none;">
        <div class="game-end-content">
            <h2 id="game-end-title" class="game-end-title"></h2>
            <p id="game-end-message" class="game-end-message"></p>
            <button id="play-again-btn" class="play-again-btn">Play Again</button>
        </div>
    </div>

    <!-- Main Game Content (hidden until game starts) -->
    <div id="game-container" style="display:none;">
        <!-- Top turn display for Player 2 (rotated) -->
        <div class="turn-info turn-info-top">
            <div id="turn-display-top" class="turn-display-rotated">Player 1's turn</div>
        </div>

        <!-- Top voice control button for Player 2 (rotated for Player 2's view) -->
        <div class="voice-controls-top">
            <button class="voice-btn voice-btn-rotated" id="start-voice-btn-top">
                🎤 Start Voice Control
            </button>
            <div class="voice-status voice-status-rotated" id="voice-status">Voice Recognition: Off</div>
        </div>

        <div class="board" id="board"></div>

        <!-- Bottom turn display for Player 1 -->
        <div class="turn-info turn-info-bottom">
            <div id="turn-display-bottom">Player 1's turn</div>
        </div>

        <!-- Bottom controls: voice button + settings -->
        <div class="bottom-controls">
            <!-- Bottom voice command button for Player 1 -->
            <button class="voice-btn" id="start-voice-btn-bottom">
                🎤 Start Voice Control
            </button>
            <!-- Settings dropdown -->
            <div class="settings-dropdown" id="settings-dropdown">
                <button class="settings-btn" id="settings-btn">⚙️ Settings</button>
                <div class="settings-content" id="settings-content">
                    <label>
                        <input type="checkbox" id="voice-feedback-checkbox">
                        Voice prompt feedback
                    </label>
                    <label>
                        <input type="radio" name="game-mode" value="two-player" checked>
                        Two Players
                    </label>
                    <label>
                        <input type="radio" name="game-mode" value="ai">
                        Play vs AI
                    </label>
                    <label id="ai-difficulty-container" style="display: none;">
                        AI Difficulty:
                        <select id="ai-difficulty">
                            <option value="easy">Easy</option>
                            <option value="medium" selected>Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </label>
                    <label id="tutorial-mode-container" style="display: none;">
                        <input type="checkbox" id="tutorial-mode-checkbox">
                        Tutorial Mode
                    </label>
                    <button id="reset-game-btn" class="reset-game-btn">Reset Game</button>
                </div>
            </div>
        </div>

        <div class="last-command" id="last-command">Last command: None</div>
        <div class="error-message" id="error-message"></div>
        <div class="game-status" id="game-status"></div>
        
        <!-- Logo at bottom -->
        <div class="bottom-logo">
            <img src="assets/file_000000007b2862468a3b715616fbfddd.png" alt="Logo" class="game-logo">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
